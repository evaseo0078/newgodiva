<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — DropWise YYC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3 C24 3 9 20 9 30 a15 15 0 0 0 30 0 C39 20 24 3 24 3z" fill="#fff"/>
        <path d="M12 34 l7-9 5 6 4-4 8 7 a15 15 0 0 1 -24 0z" fill="#2b7bd6"/>
      </svg>
      <div>
        <strong>DropWise <span class="yyc">YYC</span></strong>
        <span class="tagline" data-i18n="tagline">Calgary's community water saver</span>
      </div>
    </div>
    <nav class="top-actions" aria-label="Display options">
      <label for="langSelect" class="sr-only">Language</label>
      <select id="langSelect" class="lang-select">
        <option value="en">🌐 English</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </nav>
  </header>

  <main class="login-main">
    <article class="card login-card" aria-labelledby="loginTitle">
      <div class="login-drop" aria-hidden="true">💧</div>
      <h1 id="loginTitle" data-i18n="login.title">Log in to DropWise</h1>
      <p class="muted" data-i18n="login.sub">Log in to keep your household's water records in your own account.</p>

      <form id="loginForm" class="login-form" novalidate>
        <label id="nameRow" hidden><span data-i18n="login.name">Name</span>
          <input id="name" type="text" autocomplete="name" />
        </label>
        <label><span data-i18n="login.email">Email</span>
          <input id="email" type="email" autocomplete="email" required />
        </label>
        <label><span data-i18n="login.password">Password (8+ characters)</span>
          <input id="password" type="password" autocomplete="current-password" minlength="8" required />
        </label>
        <p id="loginError" class="login-error" role="alert"></p>
        <button id="submitBtn" class="btn-primary big" type="submit"><span data-i18n="login.signin">Log in</span></button>
        <button id="createSubmit" class="btn-primary big" type="submit" hidden><span data-i18n="login.create">Create account</span></button>
      </form>

      <p class="login-switch">
        <button id="toCreate" type="button" class="link-btn" data-i18n="login.toCreate">New here? Create an account</button>
        <button id="toSignin" type="button" class="link-btn" data-i18n="login.toSignin" hidden>Already have an account? Log in</button>
      </p>
      <button id="guestBtn" type="button" class="glass-btn guest-btn" data-i18n="login.guest">Look around without logging in</button>
      <p id="modeNote" class="fineprint"></p>
      <p id="localNote" class="fineprint" data-i18n="login.note">Demo version: accounts and records are stored only on this device. Passwords are stored as a hash, never as plain text.</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data/config.js"></script>
  <script src="data/i18n.js"></script>
  <script src="cloud.js"></script>
  <script src="login.js"></script>
</body>
</html>
